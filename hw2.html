<head>

        .box2{
            border: 2px solid black;
            width: 200px;
            height: 200px;
            padding: 20px;
            background-color: antiquewhite;
        }
        .box3{
            border: 2px solid black;
            width: 110px;
            height: 110px;
            background-color:wheat;
        }

</head>
<body>
    <div class="container"></div>
<div class="box box1">

        <div class="box box3">      
        </div>

</div>

</html>
