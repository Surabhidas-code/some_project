<!DOCTYPE html>

<head>

    <title>Document</title>
    <style>
        body{

        }
        .box3{
            background-color: tan;
            width: 32%;
            height: 10%;
            border: 2px solid black;
            margin: 10px;
            padding: 30px;
            /* display: flex;
            align-items: center;
            justify-content: center; */
        }

</head>
<body>

</html>
