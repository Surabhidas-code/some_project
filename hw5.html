<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        box-sizing: border-box;
        /* width: 100vh; */
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        }
        .container{
            background-color:blanchedalmond;
            width: 50vw;
            height: 60vh;
            margin: 20px;
            padding: 20px;
            border: 3px solid black;
            display: flex;
        }
        .boxB{
            background-color: teal;
            width: 50vw;
            height: 63px;
            margin: 6px;
            padding: 8px;
            border: 2px solid black;

        }
        .boxA{
            background-color:violet;
            width: 100px;
            height: 90%;
            border: 2px solid black;
            margin: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="boxA"></div>
        <div class="boxB"></div>
    </div>
</body>
</html>
