<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        box-sizing: border-box;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        }
        .container{
            background-color:#C5B3D3;
            width: 70vw;
            height: 75vh;
            margin: 20px;
            padding: 20px;
            border: 3px solid black;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .boxA{
            background-color:#F5CBCB;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 67vw;
            height: 20vh;
            margin: 7px;
            padding: 10px;
            border: 2px solid black;
            justify-content: space-between;
        }
        .boxX{
            background-color:#FFE2E2;
            width: 12vw;
            height: 12vh;
            /* margin: 9px; */
            padding: 7px;
            border: 1px solid black;
            gap: 20px;
        }
        .boxY{
            background-color:#FFE2E2;
            justify-content:space-between;
            width: 12vw;
            height: 12vh;
            /* margin: 9px; */
            padding: 7px;
            border: 1px solid black;
        }
        .boxB{
            background-color:#F7F4ED;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 67vw;
            height: 20vh;
            margin: 7px;
            padding: 10px;
            border: 1px solid black;
        }
        .boxS{
            background-color:#C8A96B;
            width: 34vw;
            height: 12vh;
            padding: 10px;
            border: 1px solid black;
        }
        .boxC{
            background-color:#8FA28A;
            width: 67vw;
            height: 20vh;
            margin: 7px;
            padding: 10px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
        }
        .box{
            background-color:#C7D3C0;
            width: 75px;
            height: 75px;
            border: 1px solid black;
            display: flex;
            /* margin: 20px; */
            padding: 20px;
            align-items: center;
            justify-content: center;
            flex-direction: column;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="boxA">
            <div class="boxX"></div>
            <div class="boxY"></div>
        </div>
        <div class="boxB">
            <div class="boxS"></div>
        </div>
        <div class="boxC">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>
</html>
