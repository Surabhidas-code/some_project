<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>/
    <!-- <script src="https://unpkg.com/lucide@latest"></script> -->
    <style>
        form {
            margin: 1rem;
        }

        body {
            box-sizing: border-box;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:#C9ADA7;
        }

        .container {
            background-color: #FDF0D5;
            border: 2px solid #003049;
            width: 25vw;
            height: 70vh;
            margin: 20px;
            padding: 10px;
            text-align: right;
            border-radius: 14px;
            box-shadow: 1px 1px 25px #dfdbdb;
        }

        h1 {
            color: black;
            width: 10vw;
            height: 5vh;
            margin: auto;
            padding: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align: center;
        }

        input {
            background-color: wheat;
            width: 21vw;
            height: 2vh;
            border: 1px solid #003049;
            margin-top: 20px;
            padding: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            border-radius: 7px;
        }

        button {
            background-color: #160d46;
            color: white;
            width: 23vw;
            height: 7vh;
            margin: 12px;
            border-radius: 8px;
        }

        button:hover {
            color: rgba(78, 24, 204, 0.774);
        }

        div {
            color: white;
        }

        .or {
            width: 1vw;
            background-color:#FDF0D5;
            height: auto;
            position: relative;
            margin: auto;
            top: -18px;
            z-index: 1;
            padding-left: 14px;
            padding-right: 14px;
            color: black;

        }

        .id {
            width: 50vw;
            height: 10vh;
            margin: 10px;
        }

        .gofa {
            width: 97%;
            height: 6vh;
            margin: 2px;
            display: flex;
            padding: 6px;
        }

        .gofa div {
            width: 41vw;
            height: 63%;
            background-color: white;
            color: black;
            margin: 4px;
            padding: 4px;
            text-align: center;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            border-radius: 5px;
            border: 1px solid #003049;
        }

        h4 {
            display: flex;
            text-align: center;
            justify-content: center;
            font-family: 'Times New Roman', Times, serif;
            color: black;
        }

        .sign-up {
            color: #379AFF;
            padding-left: 7px;
        }

        .forgot {
            text-align: right;
            width: 24vw;
            color: #379AFF;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Login</h1>
        <form>
            <input type="text" placeholder="Enter Email" required>
            <input type="text" placeholder="Enter Password" required>
        </form>
        <div class="forgot">Forgot Password?</div>
        <button>Login</button>
        <hr>
        <div class="or">or</div>
        <div class="gofa">
            <div>Login with Google</div>
            <div>Login with Facebook</div>
        </div>
        <h4>Don't have an account? <div class="sign-up">Sign Up</div>
        </h4>
    </div>
</body>

</html>
