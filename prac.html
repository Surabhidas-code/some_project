<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANOTHER PRACTICE</title>
    <link rel="stylesheet" href="prac.css">
</head>
<body>
    <div class="first">
        <p>HABIT RINGS</p>
         <h1>Every day you show grows another <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ring</h1>
        <h4>Add a habit, mark it done each day. Streaks grow like tree rings - the longer you keep at it, the more rings you <br>earn.</h4>
    </div>
    <div class="div2">
        <div class="box"><div class="box0">0</div><div class="boxWord">HABITS</div></div>
        <div class="box"><div class="box0">0</div><div class="boxWord">BEST STREAK</div></div>
        <div class="box"><div class="box0">0%</div><div class="boxWord">TODAY</div></div>
    </div>
    <div class="form">
        <form>
            <input type="text" placeholder="e.g. Read 10 pages, No sugar, Morning walk..." /> 
        </form>
        <button>Add Habit</button>
    </div>
    <div class="habit"></div>
    <div class="emoji">&#127793;</div>
    <div class="desc">No habits yet. Plant your first one above and start growing rings.</div>
    <script src="prac.js"></script>
</body>
</html>
