<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

            <tr>

            </tr>
            <tr>
                <td>2</td>
                <td>Meaw</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Employee</td>
                <td>2</td>
            </tr>
        </tfoot>
    </table>

</html>
